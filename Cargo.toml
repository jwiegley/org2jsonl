[package]
name = "org2jsonl"
version = "0.1.0"
edition = "2021"
description = "Convert Emacs Org-mode files to/from JSONL for manipulation with standard JSON tools"
license = "BSD-3-Clause"
authors = ["John Wiegley <johnw@newartisans.com>"]

[dependencies]
clap = { version = "4", features = ["derive"] }
orgize = "0.10.0-alpha.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"

[dev-dependencies]
proptest = "1"
pretty_assertions = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "org2jsonl"
path = "src/bin/org2jsonl.rs"

[[bin]]
name = "jsonl2org"
path = "src/bin/jsonl2org.rs"

[[bench]]
name = "roundtrip"
path = "benches/bench_roundtrip.rs"
harness = false

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true
