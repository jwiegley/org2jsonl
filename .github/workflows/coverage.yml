name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  # Coverage threshold for library code (excluding bin/ CLI wrappers)
  COVERAGE_THRESHOLD: 90
  COVERAGE_IGNORE_REGEX: 'tests/.*|benches/.*|examples/.*|bin/.*'

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cargo llvm-cov test \
            --ignore-filename-regex="$COVERAGE_IGNORE_REGEX" \
            --lcov \
            --output-path lcov.info

      - name: Check coverage threshold
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex="$COVERAGE_IGNORE_REGEX" \
            --fail-under-lines $COVERAGE_THRESHOLD \
            || { echo "::error::Line coverage is below the ${COVERAGE_THRESHOLD}% threshold (see TOTAL row above)"; exit 1; }

      - name: Generate HTML coverage report
        if: always()
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex="$COVERAGE_IGNORE_REGEX" \
            --html \
            --output-dir target/coverage

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 30

      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 30
